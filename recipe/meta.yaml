{% set name = "pyro-ppl" %}
{% set version = "1.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e4a4b089023777c0bc98c01db4c6ed5e39a1001985ebccfe210dc545bf5b24dd

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=77
  run:
    - numpy >=1.7
    - opt_einsum >=2.3.2
    - pyro-api >=0.1.1
    - python >={{ python_min }}
    - pytorch >=2.0
    - tqdm >=4.36

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyro
    - pyro.contrib
    - pyro.distributions
    - pyro.infer
    - pyro.nn
    - pyro.ops
    - pyro.optim
    - pyro.params
    - pyro.poutine

about:
  home: http://pyro.ai
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.md
  summary: A Python library for probabilistic modeling and inference
  doc_url: https://docs.pyro.ai/
  dev_url: https://github.com/pyro-ppl/pyro/

extra:
  recipe-maintainers:
    - jamestwebber
